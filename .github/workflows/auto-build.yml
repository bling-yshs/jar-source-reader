name: 🛠️ 自动构建 (Auto Build)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布 Build Skill (Build and Publish Build Skill)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '21'

      - name: 配置 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v5

      - name: 授予 Gradle Wrapper 执行权限 (Grant Gradle Wrapper Execute Permission)
        run: chmod +x gradlew

      - name: 运行 build 构建 (Run Gradle Build)
        run: ./gradlew build

      - name: 整理 Skill 目录 (Prepare Skill Directory)
        run: |
          PACKAGE_ROOT="dist/jar-source-reader"
          mkdir -p "$PACKAGE_ROOT/tool"
          cp SKILL.md "$PACKAGE_ROOT/SKILL.md"
          cp build/libs/jar-source-reader.jar "$PACKAGE_ROOT/tool/jar-source-reader.jar"
          cp print-all-jar.gradle "$PACKAGE_ROOT/tool/print-all-jar.gradle"

      - name: 发布到 build 分支 (Publish Build Branch)
        run: |
          PUBLISH_DIR="$(mktemp -d)"
          git worktree add --detach "$PUBLISH_DIR" HEAD
          git -C "$PUBLISH_DIR" switch --orphan build
          git -C "$PUBLISH_DIR" rm -rf . >/dev/null 2>&1 || true
          cp -a dist/jar-source-reader/. "$PUBLISH_DIR/"

          git -C "$PUBLISH_DIR" config user.name "github-actions[bot]"
          git -C "$PUBLISH_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PUBLISH_DIR" add .
          git -C "$PUBLISH_DIR" commit -m "build: ${GITHUB_SHA::7}"
          git -C "$PUBLISH_DIR" push --force origin HEAD:build
          git worktree remove --force "$PUBLISH_DIR"
